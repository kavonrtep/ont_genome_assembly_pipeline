name: version

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging
        run: pip install --quiet "packaging>=23"

      - name: Parse version.py
        id: parse
        run: |
          v=$(python <<'PY'
          import sys
          sys.path.insert(0, '.')
          from version import __version__, parse_version
          parse_version(__version__)
          print(__version__)
          PY
          )
          echo "Pipeline version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Tag-match check
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PY_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" != "$PY_VERSION" ]; then
            echo "::error::tag '$tag' does not match version.py ('$PY_VERSION')"
            exit 1
          fi
          echo "Tag '$tag' matches version.py."

      - name: Monotonic check vs previous main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PY_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          prev_sha="${{ github.event.before }}"
          if [ -z "$prev_sha" ] || [ "$prev_sha" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous main commit; skipping monotonic check."
            exit 0
          fi
          if git show "${prev_sha}:version.py" > /tmp/prev_version.py 2>/dev/null; then
            prev=$(python <<'PY'
            import importlib.util
            spec = importlib.util.spec_from_file_location('prev_version', '/tmp/prev_version.py')
            m = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(m)
            print(m.__version__)
            PY
            )
            echo "previous: $prev   new: $PY_VERSION"
            python <<PY
            from packaging.version import Version
            prev, curr = Version("$prev"), Version("$PY_VERSION")
            assert curr >= prev, f"version went backwards: {prev} -> {curr}"
            print(f"OK: {prev} <= {curr}")
            PY
          else
            echo "version.py absent on previous main commit; skipping monotonic check."
          fi
